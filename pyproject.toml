[project]
name = "financebot-showcase"
version = "1.1.0"
description = "Offline quantitative-research and agent-cadence evaluation showcase."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "python-dateutil>=2.8",
  "requests>=2.31",
  "youtube-transcript-api>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
